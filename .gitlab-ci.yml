# RAGFlow GitLab CI/CD 流水线
# 基于 GitLab 官方 Docker 模板优化

# 定义流水线阶段
stages:
  - build
  - test
  - deploy

# 全局变量定义
variables:
  REGISTRY: "registry.tyqy.duckdns.org"  # 私有Registry地址
  PLATFORM: "linux/amd64"                # 目标平台
  PROJECT_NAME: "ragflow"                # 项目名称
  PYTHON_VERSION: "3.10"                 # Python版本
  # Docker 构建缓存配置
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"
  # 缓存配置
  CACHE_KEY: "$CI_COMMIT_REF_SLUG-$CI_JOB_NAME"
  CACHE_PREFIX: "ragflow"

# 全局缓存配置
cache:
  key: 
    files:
      - pyproject.toml
      - uv.lock
  paths:
    - .cache/uv
    - .cache/npm
    - .cache/apt
    - .cache/pip
    - .cache/cargo
  policy: pull-push

# 构建阶段
build:
  stage: build
  tags:
    - shell
    - tyqy
  # 构建阶段专用缓存
  cache:
    key: 
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .cache/uv
      - .cache/npm
      - .cache/apt
      - .cache/pip
      - .cache/cargo
    policy: pull-push
    when: 'on_success'
  before_script:
    - echo "=== RAGFlow CI/CD 流水线开始 ==="
    - echo "项目:${PROJECT_NAME}"
    - export GIT_COMMIT_ID=${CI_COMMIT_SHORT_SHA}
    - export TIMESTAMP=$(date +"%Y%m%d%H%M")
    - export IMAGE_TAG="0.19.0-${TIMESTAMP}-${GIT_COMMIT_ID}"
    - export IMAGE_NAME="${REGISTRY}/${PROJECT_NAME}"
    - echo "镜像名称：${IMAGE_NAME}"
    - echo "镜像标签：${IMAGE_TAG}"
    
    # 运行构建优化脚本
    - echo "=== 运行构建优化脚本 ==="
    - bash scripts/optimize_build.sh
  script:
    - echo "=== 开始构建RAGFlow Docker镜像 ==="
    - echo "目标平台：${PLATFORM}"
    - echo "Python版本：${PYTHON_VERSION}"
    
    # 检查Docker环境
    - echo "=== 检查Docker环境 ==="
    - docker info
    - docker version
    
    # 检查项目文件
    - echo "=== 检查项目文件 ==="
    - ls -la
    - echo "检查关键文件："
    - test -f Dockerfile && echo "✅ Dockerfile 存在" || echo "❌ Dockerfile 不存在"
    - test -f pyproject.toml && echo "✅ pyproject.toml 存在" || echo "❌ pyproject.toml 不存在"
    - test -f uv.lock && echo "✅ uv.lock 存在" || echo "❌ uv.lock 不存在"
    
    # 构建镜像（使用 BuildKit 缓存）
    - echo "=== 开始Docker构建（使用缓存） ==="
    - |
      docker buildx build \
        --platform ${PLATFORM} \
        --build-arg NEED_MIRROR=1 \
        --cache-from type=registry,ref=${IMAGE_NAME}:buildcache \
        --cache-to type=registry,ref=${IMAGE_NAME}:buildcache,mode=max \
        --file ./Dockerfile \
        --tag ${IMAGE_NAME}:${IMAGE_TAG} \
        --tag ${IMAGE_NAME}:latest \
        --progress=plain \
        --load \
        .
    
    # 验证镜像构建成功
    - echo "=== 验证镜像构建成功 ==="
    - docker images | grep ${PROJECT_NAME}
    
    # 推送镜像到远端
    - echo "=== 推送镜像到远端 ==="
    - docker push ${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${IMAGE_NAME}:latest

    # 生成 build.env 文件
    - echo "=== 生成build.env文件 ==="
    - echo "IMAGE_NAME=${IMAGE_NAME}" > build.env
    - echo "IMAGE_TAG=${IMAGE_TAG}" >> build.env
    - echo "GIT_COMMIT_ID=${GIT_COMMIT_ID}" >> build.env
    - echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> build.env
    - echo "PROJECT_NAME=${PROJECT_NAME}" >> build.env
    - echo "PYTHON_VERSION=${PYTHON_VERSION}" >> build.env
    
    - echo "=== 构建和推送完成！ ==="
    - echo "镜像标签：${IMAGE_NAME}:${IMAGE_TAG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "production"'
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
    when: 'on_success'

# 测试阶段
test_docker:
  stage: test
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--registry-mirror", "https://registry.tyqy.duckdns.org"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - shell
    - tyqy
  script:
    - echo "=== 开始测试阶段 ==="
    - echo "1. 测试Docker连接..."
    - docker info
    - echo "Docker连接测试完成"
    
    - echo "2. 测试镜像拉取..."
    - docker pull ${IMAGE_NAME}:${IMAGE_TAG}
    - echo "镜像拉取成功"
    
    - echo "3. 测试镜像基本信息..."
    - docker run --rm --entrypoint="" ${IMAGE_NAME}:${IMAGE_TAG} python --version
    - docker run --rm --entrypoint="" ${IMAGE_NAME}:${IMAGE_TAG} cat /ragflow/VERSION
    - echo "镜像基本信息测试完成"
    
    - echo "4. 校验Registry镜像是否存在..."
    - |
      REGISTRY_URL="https://${REGISTRY}/v2/${PROJECT_NAME}/manifests/${IMAGE_TAG}"
      echo "检查URL: $REGISTRY_URL"
      
      if wget --spider --server-response --no-verbose "$REGISTRY_URL" 2>&1 | grep -q "HTTP/.* 200"; then
        echo "✅ 镜像 ${IMAGE_NAME}:${IMAGE_TAG} 已存在于Registry"
      else
        echo "❌ 镜像 ${IMAGE_NAME}:${IMAGE_TAG} 不存在于Registry"
        exit 1
      fi
    
    - echo "=== 所有测试完成 ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "production"'
  dependencies:
    - build

