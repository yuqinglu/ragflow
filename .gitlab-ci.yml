# 生产环境部署阶段
deploy_production:
  stage: deploy
  tags:
    - deploy
    - aly3
  script:
    - echo "=== 开始部署到生产环境 ==="
    - echo "部署镜像：${IMAGE_NAME}:${IMAGE_TAG}"
    - echo "环境：生产环境 (production分支)"
    
    # 登录阿里云ACR
    - echo "=== 登录阿里云ACR ==="
    - echo "r3YyO%jy0zr@MEeTMOHHKhfaM#)c6P8z" | docker login --username=deploybot@1740345584619196 acr-1-registry-vpc.cn-beijing.cr.aliyuncs.com --password-stdin
    
    # 定义镜像名称
    - export SOURCE_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
    - export TARGET_REGISTRY="acr-1-registry-vpc.cn-beijing.cr.aliyuncs.com"
    - export TARGET_NAMESPACE="tyqy"
    - export TARGET_IMAGE="${TARGET_REGISTRY}/${TARGET_NAMESPACE}/${PROJECT_NAME}:${IMAGE_TAG}"
    
    # 复制镜像到阿里云ACR
    - echo "=== 复制镜像到阿里云ACR ==="
    - echo "源镜像：${SOURCE_IMAGE}"
    - echo "目标镜像：${TARGET_IMAGE}"
    
    # 在sudo环境中执行镜像操作
    - |
      sudo bash -c "
        set -e
        
        echo '正在拉取源镜像：${SOURCE_IMAGE}'
        docker pull ${SOURCE_IMAGE}
        
        echo '正在给镜像打标签：${TARGET_IMAGE}'
        docker tag ${SOURCE_IMAGE} ${TARGET_IMAGE}
        
        echo '正在推送到阿里云ACR：${TARGET_IMAGE}'
        docker push ${TARGET_IMAGE}
        
        echo '正在推送latest标签'
        docker tag ${SOURCE_IMAGE} ${TARGET_REGISTRY}/${TARGET_NAMESPACE}/${PROJECT_NAME}:latest
        docker push ${TARGET_REGISTRY}/${TARGET_NAMESPACE}/${PROJECT_NAME}:latest
        
        echo '镜像复制完成'
      "
    
    - echo "=== 镜像复制完成 ==="
    - echo "镜像已推送到：${TARGET_IMAGE}"
    
    # 执行生产环境部署
    - echo "=== 执行生产环境部署 ==="
    # TODO: 生产环境部署命令，调用阿里云API
    - echo "TODO：生产环境部署命令，调用阿里云API来实现"

    - echo "=== 生产环境部署完成 ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  dependencies:
    - build
  # when: manual  # 生产环境需要手动触发

  # 定义生产环境，让GitLab接管部署和回滚
  environment:
    name: production